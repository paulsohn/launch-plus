connections:
  # ── Core subscriptions ──────────────────────────────────────────────────────
  - topic: ~/input/route
    type: subscription
    msg_type: autoware_planning_msgs/msg/LaneletRoute

  - topic: ~/input/vector_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin

  - topic: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry

  - topic: ~/input/accel
    type: subscription
    msg_type: geometry_msgs/msg/AccelWithCovarianceStamped

  - topic: ~/input/scenario
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/Scenario

  - topic: ~/input/perception
    type: subscription
    msg_type: autoware_perception_msgs/msg/PredictedObjects

  - topic: ~/input/occupancy_grid_map
    type: subscription
    msg_type: nav_msgs/msg/OccupancyGrid

  - topic: ~/input/costmap
    type: subscription
    msg_type: nav_msgs/msg/OccupancyGrid

  - topic: ~/input/traffic_signals
    type: subscription
    msg_type: autoware_perception_msgs/msg/TrafficLightGroupArray

  - topic: ~/input/lateral_offset
    type: subscription
    msg_type: tier4_planning_msgs/msg/LateralOffset

  # Absolute topic (not ~/…): operation_mode state from system API
  - topic: /system/operation_mode/state
    type: subscription
    msg_type: autoware_adapi_v1_msgs/msg/OperationModeState

  # Absolute topic: external velocity limit from scenario planning
  - topic: /planning/scenario_planning/max_velocity
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/VelocityLimit

  # ── Core publishers ──────────────────────────────────────────────────────────
  - topic: ~/output/path
    type: publisher
    msg_type: autoware_internal_planning_msgs/msg/PathWithLaneId

  - topic: ~/output/turn_indicators_cmd
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/TurnIndicatorsCommand

  - topic: ~/output/hazard_lights_cmd
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/HazardLightsCommand

  - topic: ~/output/modified_goal
    type: publisher
    msg_type: autoware_planning_msgs/msg/PoseWithUuidStamped

  - topic: ~/output/is_reroute_available
    type: publisher
    msg_type: tier4_planning_msgs/msg/RerouteAvailability

  # ── Static debug publishers (always present) ─────────────────────────────────
  - topic: ~/debug/avoidance_debug_message_array
    type: publisher
    msg_type: tier4_planning_msgs/msg/AvoidanceDebugMsgArray

  - topic: ~/debug/turn_signal_info
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray

  - topic: ~/debug/bound
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray

  # PlannerManager DebugPublisher("~/debug") publishes lazily at runtime:
  # ~/debug/root_reference_path (MarkerArray), ~/debug/internal_state (StringStamped),
  # and ~/debug/<module_name> (Float64Stamped) for each module's processing time.
  - topic: ~/debug/root_reference_path
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray

  - topic: ~/debug/internal_state
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/StringStamped

  # PublishedTimePublisher: appends "/debug/published_time" to the output/path topic.
  - topic: ~/output/path/debug/published_time
    type: publisher
    msg_type: autoware_internal_msgs/msg/PublishedTime

  # PlanningFactorInterface for the core node (registered as "behavior_path_planner")
  - topic: /planning/planning_factors/behavior_path_planner
    type: publisher
    msg_type: autoware_internal_planning_msgs/msg/PlanningFactorArray

  # ── Per-module path_candidate / path_reference publishers ───────────────────
  # Created in BehaviorPathPlannerNode constructor for every loaded module manager.
  # Topic name pattern: /planning/path_candidate/<module_name>
  #                     /planning/path_reference/<module_name>
  # Module name strings are the snake_case names set in each manager's constructor.

  - topic: /planning/path_candidate/static_obstacle_avoidance
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::StaticObstacleAvoidanceModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_reference/static_obstacle_avoidance
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::StaticObstacleAvoidanceModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_candidate/side_shift
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::SideShiftModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_reference/side_shift
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::SideShiftModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_candidate/bidirectional_traffic
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::BidirectionalTrafficModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_reference/bidirectional_traffic
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::BidirectionalTrafficModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_candidate/start_planner
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::StartPlannerModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_reference/start_planner
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::StartPlannerModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_candidate/goal_planner
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::GoalPlannerModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_reference/goal_planner
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::GoalPlannerModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_candidate/lane_change_right
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::LaneChangeRightModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_reference/lane_change_right
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::LaneChangeRightModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_candidate/lane_change_left
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::LaneChangeLeftModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_reference/lane_change_left
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::LaneChangeLeftModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_candidate/avoidance_by_lane_change
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::AvoidanceByLaneChangeModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/path_reference/avoidance_by_lane_change
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path
    when: "'autoware::behavior_path_planner::AvoidanceByLaneChangeModuleManager' in params.get('launch_modules', [])"

  # ── Per-module debug/info/virtual_wall/drivable_lanes publishers ─────────────
