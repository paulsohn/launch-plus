connections:
  - topic: ~/input/imu_raw
    type: subscription
    msg_type: sensor_msgs/msg/Imu
  - topic: ~/input/odom
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - topic: ~/input/pose_ndt
    type: subscription
    msg_type: geometry_msgs/msg/PoseWithCovarianceStamped
  - topic: ~/output/gyro_bias
    type: publisher
    msg_type: geometry_msgs/msg/Vector3Stamped
  - topic: ~/output/gyro_scale
    type: publisher
    msg_type: geometry_msgs/msg/Vector3Stamped
  - topic: ~/output/imu_scaled
    type: publisher
    msg_type: sensor_msgs/msg/Imu
