  # ── RTC (cooperate status / commands / auto-mode) per module ─────────────────
  # RTCInterface publishes /planning/cooperate_status/<rtc_name>
  # and /planning/auto_mode_status/<rtc_name>, and serves services
  # /planning/cooperate_commands/<rtc_name> and /planning/enable_auto_mode/<rtc_name>.
  #
  # rtc_name = convertToSnakeCase(module_name) + optional "_left"/"_right" suffix.
  # Modules with initInterface(node, {""}) → one channel named after the module.
  # Modules with initInterface(node, {"left","right"}) → two channels: <name>_left, <name>_right.
  # Modules with initInterface(node, {}) → no RTC channel (side_shift, bidirectional_traffic).

  # static_obstacle_avoidance: {"left", "right"}
  - topic: /planning/cooperate_status/static_obstacle_avoidance_left
    type: publisher
    msg_type: tier4_rtc_msgs/msg/CooperateStatusArray
    when: "'autoware::behavior_path_planner::StaticObstacleAvoidanceModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/cooperate_status/static_obstacle_avoidance_right
