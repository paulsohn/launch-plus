connections:
  # Inputs
  - topic: in/pedals_cmd
    type: subscription
    msg_type: autoware_adapi_v1_msgs/msg/PedalsCommand

  - topic: in/heartbeat
    type: subscription
    msg_type: autoware_adapi_v1_msgs/msg/ManualOperatorHeartbeat

  - topic: in/steering_cmd
    type: subscription
    msg_type: autoware_adapi_v1_msgs/msg/SteeringCommand

  - topic: in/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry

  - topic: in/gear_cmd
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/GearCommand

  - topic: in/current_gate_mode
    type: subscription
    msg_type: tier4_control_msgs/msg/GateMode

  # Outputs
  - topic: out/control_cmd
    type: publisher
    msg_type: autoware_control_msgs/msg/Control
