    msg_type: tier4_rtc_msgs/msg/CooperateStatusArray
    when: "'autoware::behavior_path_planner::StaticObstacleAvoidanceModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/cooperate_commands/static_obstacle_avoidance_left
