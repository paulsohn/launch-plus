connections:
  # subscriptions
  - topic: ~/input/path
    type: subscription
    msg_type: autoware_planning_msgs/msg/Path
  - topic: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry

  # publishers
  - topic: ~/output/traj
    type: publisher
    msg_type: autoware_planning_msgs/msg/Trajectory
  - topic: ~/output/path
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path

  # debug publishers
  - topic: ~/debug/extended_traj
    type: publisher
    msg_type: autoware_planning_msgs/msg/Trajectory
  - topic: ~/debug/calculation_time
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/StringStamped
  - topic: ~/debug/processing_time_ms
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float64Stamped
