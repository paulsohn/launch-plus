connections:
  - topic: ~/input/vector_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin
  - topic: ~/input/camera_info
    type: subscription
    msg_type: sensor_msgs/msg/CameraInfo
  - topic: ~/input/route
    type: subscription
    msg_type: autoware_planning_msgs/msg/LaneletRoute
  - topic: ~/output/rois
    type: publisher
    msg_type: tier4_perception_msgs/msg/TrafficLightRoiArray
  - topic: ~/expect/rois
    type: publisher
    msg_type: tier4_perception_msgs/msg/TrafficLightRoiArray
  - topic: ~/debug/markers
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
