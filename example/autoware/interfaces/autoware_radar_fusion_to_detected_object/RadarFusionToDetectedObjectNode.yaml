connections:
  - topic: ~/input/objects
    type: subscription
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - topic: ~/input/radars
    type: subscription
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - topic: ~/output/objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - topic: ~/debug/low_confidence_objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/DetectedObjects
