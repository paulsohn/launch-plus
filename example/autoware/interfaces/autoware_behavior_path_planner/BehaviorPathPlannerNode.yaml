  # avoidance_by_lane_change: {"left", "right"}
  - topic: /planning/cooperate_status/avoidance_by_lane_change_left
    type: publisher
    msg_type: tier4_rtc_msgs/msg/CooperateStatusArray
    when: "'autoware::behavior_path_planner::AvoidanceByLaneChangeModuleManager' in params.get('launch_modules', [])"

