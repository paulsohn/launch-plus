connections:
  # rois_ids is a list[int] — topic names use the ID value as a string suffix.
  # The actual topic for each ID is declared as a parameter with a sensible default.
  - loop: "to_list(params.get('rois_ids', []))"
    name_expr: "params.get('input/camera_info' + item, '/sensing/camera/camera' + item + '/camera_info')"
    type: subscription
    msg_type: sensor_msgs/msg/CameraInfo
  - loop: "to_list(params.get('rois_ids', []))"
    name_expr: "params.get('input/rois' + item, '/perception/object_recognition/detection/rois' + item)"
    type: subscription
    msg_type: tier4_perception_msgs/msg/DetectedObjectsWithFeature
  - loop: "to_list(params.get('rois_ids', []))"
    name_expr: "params.get('output/rois' + item + '/objects', '~/rois' + item + '/objects')"
    type: publisher
    msg_type: autoware_perception_msgs/msg/DetectedObjects
