connections:
  - name: input/velocity_limit_from_api
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/VelocityLimit
  - name: input/velocity_limit_from_internal
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/VelocityLimit
  - name: input/velocity_limit_clear_command_from_internal
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/VelocityLimitClearCommand
  - name: output/external_velocity_limit
    type: publisher
    msg_type: autoware_internal_planning_msgs/msg/VelocityLimit
  - name: output/debug
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/StringStamped
