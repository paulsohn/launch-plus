name: Autoware Integration Test

on:
  push:
    branches: [devel]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Resolve + Build + Verify (${{ matrix.ros_distro }})
    runs-on: ${{ matrix.os }}
    container: ros:${{ matrix.ros_distro }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ros_distro: humble
          - os: ubuntu-24.04
            ros_distro: jazzy
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            python3-pip \
            python3-venv \
            ros-dev-tools

      - name: Initialize rosdep
        run: |
          rosdep init 2>/dev/null || true
          rosdep update
        shell: bash

      - name: Install launch-plus
        run: pip install --break-system-packages -e .

      - name: Install acados
        run: bash example/autoware/install-acados.sh

      - name: Install Autoware ML param files
        run: cp -r .github/assets/autoware_data "$HOME/autoware_data"

      - name: Run integration test
        working-directory: example/autoware
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          bash test-autoware.sh
