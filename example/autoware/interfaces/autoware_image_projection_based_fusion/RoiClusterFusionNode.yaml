connections:
  # Base FusionNode: 3D input (pointcloud/cluster) and per-camera 2D ROI + camera_info
  # rois_number is a runtime param; pattern shown for index 0
  - name: input
    type: subscription
    msg_type: tier4_perception_msgs/msg/DetectedObjectsWithFeature
  - name: input/rois0
    type: subscription
    msg_type: tier4_perception_msgs/msg/DetectedObjectsWithFeature
  - name: input/camera_info0
    type: subscription
    msg_type: sensor_msgs/msg/CameraInfo
  - name: output
    type: publisher
    msg_type: tier4_perception_msgs/msg/DetectedObjectsWithFeature
