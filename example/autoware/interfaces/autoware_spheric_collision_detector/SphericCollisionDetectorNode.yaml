connections:
  - name: input/object_recognition
    type: subscription
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - name: input/predicted_trajectory
    type: subscription
    msg_type: autoware_planning_msgs/msg/Trajectory
  - name: input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - name: debug/marker
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
