connections:
  - name: input_gnss_pose_with_cov_topic
    type: subscription
    msg_type: geometry_msgs/msg/PoseWithCovarianceStamped
  - name: input_ndt_pose_with_cov_topic
    type: subscription
    msg_type: geometry_msgs/msg/PoseWithCovarianceStamped
  - name: output_pose_with_covariance_topic
    type: publisher
    msg_type: geometry_msgs/msg/PoseWithCovarianceStamped
  - name: ~/selected_pose_type
    type: publisher
    msg_type: std_msgs/msg/String
  - name: ~/debug/ndt_position_stddev
    type: publisher
    msg_type: std_msgs/msg/Float64
    when: "to_bool(params.get('enable_debug_topics', False))"
  - name: ~/debug/gnss_position_stddev
    type: publisher
    msg_type: std_msgs/msg/Float64
    when: "to_bool(params.get('enable_debug_topics', False))"
