connections:
  # Inputs (InterProcessPollingSubscriber)
  - topic: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry

  - topic: ~/input/lanelet_map_bin
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin

  - topic: ~/input/route
    type: subscription
    msg_type: autoware_planning_msgs/msg/LaneletRoute

  - topic: ~/input/reference_trajectory
    type: subscription
    msg_type: autoware_planning_msgs/msg/Trajectory

  - topic: ~/input/predicted_trajectory
    type: subscription
    msg_type: autoware_planning_msgs/msg/Trajectory

  # Fixed absolute topics
  - topic: /api/operation_mode/state
    type: subscription
    msg_type: autoware_adapi_v1_msgs/msg/OperationModeState

  - topic: /vehicle/status/control_mode
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/ControlModeReport

  # Outputs
  # DebugPublisher publishes to ~/debug/<key>
  - topic: ~/debug/marker_array
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray

  - topic: ~/debug/processing_time_ms
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float64Stamped

  # ProcessingTimePublisher publishes to ~/debug/processing_time_ms_diag (diagnostic format)
  - topic: ~/debug/processing_time_ms_diag
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float64Stamped
    # UNVERIFIED: exact message type for diag publisher
