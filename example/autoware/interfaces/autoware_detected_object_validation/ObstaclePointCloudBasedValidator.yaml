connections:
  - topic: ~/input/detected_objects
    type: subscription
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - topic: ~/input/obstacle_pointcloud
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2
  - topic: ~/output/objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - topic: ~/debug/removed_objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - topic: ~/debug/neighbor_pointcloud
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
  - topic: ~/debug/pointcloud_within_polygon
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
