connections:
  - name: ~/input/line_segments_cloud
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2
  - name: ~/input/graph_segmented
    type: subscription
    msg_type: sensor_msgs/msg/Image
  - name: ~/output/projected_line_segments_cloud
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
  - name: ~/debug/debug_line_segments
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
  - name: ~/debug/projected_image
    type: publisher
    msg_type: sensor_msgs/msg/Image
