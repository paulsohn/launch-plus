connections:
  # Base Filter class topics
  - name: input
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2
  - name: output
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
  # Static map loading (use_dynamic_map_loading == false)
  - name: map
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2
    when: "not to_bool(params.get('use_dynamic_map_loading', False))"
  # Dynamic map loading (use_dynamic_map_loading == true)
  - name: kinematic_state
    type: subscription
    msg_type: nav_msgs/msg/Odometry
    when: "to_bool(params.get('use_dynamic_map_loading', False))"
  - name: map_loader_service
    type: service_client
    # msg_type: autoware_map_msgs/srv/GetDifferentialPointCloudMap
    when: "to_bool(params.get('use_dynamic_map_loading', False))"
