# Subscriptions are lazy: activated only when ~/output/image has at least one subscriber.
# ~/input/rough/rois is only subscribed when use_high_accuracy_detection is true.
# ~/output/image is always published but via image_transport when use_image_transport=true.
connections:
  - name: ~/input/image
    type: subscription
    msg_type: sensor_msgs/msg/Image
  - name: ~/input/rois
    type: subscription
    msg_type: tier4_perception_msgs/msg/TrafficLightRoiArray
  - name: ~/input/traffic_signals
    type: subscription
    msg_type: tier4_perception_msgs/msg/TrafficLightArray
  - name: ~/input/rough/rois
    type: subscription
    msg_type: tier4_perception_msgs/msg/TrafficLightRoiArray
    when: "to_bool(params.get('use_high_accuracy_detection', False))"
  - name: ~/output/image
    type: publisher
    msg_type: sensor_msgs/msg/Image
  # NOTE: image_transport automatically creates sub-topics ~/output/image/compressed,
  # ~/output/image/compressedDepth, ~/output/image/theora when use_image_transport=true.
  # These appear as uncovered remaps in launch files but are not expressible as static
  # connections — they are implicit image_transport codec topics.
