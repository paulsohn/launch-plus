connections:
  # ---- Core node subscriptions ----
  - name: ~/input/path_with_lane_id
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/PathWithLaneId

  - name: ~/input/dynamic_objects
    type: subscription
    msg_type: autoware_perception_msgs/msg/PredictedObjects

  - name: ~/input/no_ground_pointcloud
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2

  - name: ~/input/vehicle_odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry

  - name: ~/input/accel
    type: subscription
    msg_type: geometry_msgs/msg/AccelWithCovarianceStamped

  - name: ~/input/traffic_signals
    type: subscription
    msg_type: autoware_perception_msgs/msg/TrafficLightGroupArray

  - name: ~/input/occupancy_grid
    type: subscription
    msg_type: nav_msgs/msg/OccupancyGrid

  - name: ~/input/vector_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin

  - name: ~/input/external_velocity_limit_mps
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/VelocityLimit

  # ---- Core node publishers ----
  - name: ~/output/path
    type: publisher
    msg_type: autoware_planning_msgs/msg/Path

  - name: ~/debug/path
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray

  - name: ~/debug/processing_time_ms
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float64Stamped

  # ---- Core node service servers ----
  - name: ~/service/load_plugin
    type: service_server
    msg_type: autoware_internal_planning_msgs/srv/LoadPlugin

  - name: ~/service/unload_plugin
    type: service_server
    msg_type: autoware_internal_planning_msgs/srv/UnloadPlugin

  # ---- Module-injected: VirtualTrafficLightModulePlugin ----
  # Subscription added by VirtualTrafficLightModuleManager constructor
  - name: ~/input/virtual_traffic_light_states
    type: subscription
    msg_type: tier4_v2x_msgs/msg/VirtualTrafficLightStateArray
    when: "'autoware::behavior_velocity_planner::experimental::VirtualTrafficLightModulePlugin' in params.get('launch_modules', [])"

  - name: ~/output/infrastructure_commands
    type: publisher
    msg_type: tier4_v2x_msgs/msg/InfrastructureCommandArray
    when: "'autoware::behavior_velocity_planner::experimental::VirtualTrafficLightModulePlugin' in params.get('launch_modules', [])"

  # ---- Module-injected: TrafficLightModulePlugin ----
  - name: ~/output/traffic_signal
    type: publisher
    msg_type: autoware_perception_msgs/msg/TrafficLightGroup
    when: "'autoware::behavior_velocity_planner::experimental::TrafficLightModulePlugin' in params.get('launch_modules', [])"

  # ---- Module-injected: IntersectionModulePlugin (manager-level) ----
  - name: ~/debug/intersection/decision_state
    type: publisher
    msg_type: std_msgs/msg/String
    when: "'autoware::behavior_velocity_planner::experimental::IntersectionModulePlugin' in params.get('launch_modules', [])"

  - name: ~/debug/intersection_traffic_signal
    type: publisher
    msg_type: autoware_perception_msgs/msg/TrafficLightGroup
    when: "'autoware::behavior_velocity_planner::experimental::IntersectionModulePlugin' in params.get('launch_modules', [])"

  # ---- Module-injected: IntersectionModulePlugin (scene-level, per module instance) ----
  - name: ~/debug/intersection/ego_ttc
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float64MultiArrayStamped
    when: "'autoware::behavior_velocity_planner::experimental::IntersectionModulePlugin' in params.get('launch_modules', [])"

  - name: ~/debug/intersection/object_ttc
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float64MultiArrayStamped
    when: "'autoware::behavior_velocity_planner::experimental::IntersectionModulePlugin' in params.get('launch_modules', [])"

  # ---- Module-injected: BlindSpotModulePlugin ----
  - name: ~/debug/blind_spot/decision_state
    type: publisher
    msg_type: std_msgs/msg/String
    when: "'autoware::behavior_velocity_planner::experimental::BlindSpotModulePlugin' in params.get('launch_modules', [])"

  # ---- Module-injected: CrosswalkModulePlugin (scene-level) ----
  - name: ~/debug/collision_info
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/StringStamped
    when: "'autoware::behavior_velocity_planner::experimental::CrosswalkModulePlugin' in params.get('launch_modules', [])"

  # ---- Per-module debug publishers from SceneModuleManagerInterface base ----
  # Pattern: ~/debug/<module_name>, ~/virtual_wall/<module_name>,
  #          ~/debug/processing_time_detail_ms/<module_name>
  # The optional ~/debug/path_with_lane_id/<module_name> is controlled by the
  # is_publish_debug_path parameter and is omitted here.

  - name: ~/debug/crosswalk
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
    when: "'autoware::behavior_velocity_planner::experimental::CrosswalkModulePlugin' in params.get('launch_modules', [])"

