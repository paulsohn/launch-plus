connections:
  - name: ~/input/vector_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin
  - name: ~/input/image_raw
    type: subscription
    msg_type: sensor_msgs/msg/Image
  - name: ~/debug/init_candidates
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
  - name: ~/yabloc_align_srv
    type: service_server
    msg_type: autoware_internal_localization_msgs/srv/PoseWithCovarianceStamped
