# Two latency subscriptions use runtime params for topic names:
#   meas_to_tracked_latency_topic_name (default: .../debug/meas_to_tracked_object_ms)
#   prediction_latency_topic_name (default: .../debug/processing_time_ms)
# Defaults match the resolved.launch.xml values; override at launch time changes these topics.
connections:
  - topic: ~/input/objects
    type: subscription
    msg_type: autoware_perception_msgs/msg/PredictedObjects
  - topic: /perception/object_recognition/tracking/multi_object_tracker/debug/meas_to_tracked_object_ms
    type: subscription
    msg_type: autoware_internal_debug_msgs/msg/Float64Stamped
  - topic: /perception/object_recognition/prediction/map_based_prediction/debug/processing_time_ms
    type: subscription
    msg_type: autoware_internal_debug_msgs/msg/Float64Stamped
  - topic: ~/perception_analytics
    type: publisher
    msg_type: tier4_metric_msgs/msg/MetricArray
