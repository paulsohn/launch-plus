connections:
  - topic: ~/input/trajectories
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/ScoredCandidateTrajectories
  - topic: ~/output/trajectory
    type: publisher
    msg_type: autoware_planning_msgs/msg/Trajectory
  - topic: ~/debug/processing_time_detail_ms/trajectory_adapter
    type: publisher
    msg_type: autoware_utils_debug/msg/ProcessingTimeDetail
