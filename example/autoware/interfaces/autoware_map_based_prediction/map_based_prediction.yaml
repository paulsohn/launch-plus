connections:
  - topic: ~/input/objects
    type: subscription
    msg_type: autoware_perception_msgs/msg/TrackedObjects
  - topic: /vector_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin
  - topic: /traffic_signals
    type: subscription
    msg_type: autoware_perception_msgs/msg/TrafficLightGroupArray
  - topic: ~/output/objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/PredictedObjects
  - topic: maneuver
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
    when: "params.get('publish_debug_markers', False)"
  - topic: ~/debug/processing_time_detail_ms
    type: publisher
    msg_type: tier4_debug_msgs/msg/Float64Stamped
    when: "params.get('publish_processing_time_detail', False)"
