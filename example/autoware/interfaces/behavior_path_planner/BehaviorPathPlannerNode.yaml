# Package: autoware_behavior_path_planner (found under behavior_path_planner directory)
connections:
  - topic: ~/input/route
    type: subscription
    msg_type: autoware_planning_msgs/msg/LaneletRoute
  - topic: ~/input/vector_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin
  - topic: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - topic: ~/input/accel
    type: subscription
    msg_type: geometry_msgs/msg/AccelWithCovarianceStamped
  - topic: ~/input/scenario
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/Scenario
  - topic: ~/input/perception
    type: subscription
    msg_type: autoware_perception_msgs/msg/PredictedObjects
  - topic: ~/input/occupancy_grid_map
    type: subscription
    msg_type: nav_msgs/msg/OccupancyGrid
  - topic: ~/input/costmap
    type: subscription
    msg_type: nav_msgs/msg/OccupancyGrid
  - topic: ~/input/traffic_signals
    type: subscription
    msg_type: autoware_perception_msgs/msg/TrafficLightGroupArray
  - topic: ~/input/lateral_offset
    type: subscription
    msg_type: tier4_planning_msgs/msg/LateralOffset
  - topic: /system/operation_mode/state
    type: subscription
    msg_type: autoware_adapi_v1_msgs/msg/OperationModeState
  - topic: /planning/scenario_planning/max_velocity
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/VelocityLimit
  - topic: ~/output/path
    type: publisher
    msg_type: autoware_internal_planning_msgs/msg/PathWithLaneId
  - topic: ~/output/turn_indicators_cmd
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/TurnIndicatorsCommand
  - topic: ~/output/hazard_lights_cmd
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/HazardLightsCommand
  - topic: ~/output/modified_goal
    type: publisher
    msg_type: autoware_planning_msgs/msg/PoseWithUuidStamped
  - topic: ~/output/is_reroute_available
    type: publisher
    msg_type: tier4_planning_msgs/msg/RerouteAvailability
  - topic: ~/debug/avoidance_debug_message_array
    type: publisher
    msg_type: tier4_planning_msgs/msg/AvoidanceDebugMsgArray
  - topic: ~/debug/turn_signal_info
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
  - topic: ~/debug/bound
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
