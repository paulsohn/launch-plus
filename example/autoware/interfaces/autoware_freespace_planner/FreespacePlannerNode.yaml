connections:
  - name: ~/input/route
    type: subscription
    msg_type: autoware_planning_msgs/msg/LaneletRoute
  - name: ~/input/occupancy_grid
    type: subscription
    msg_type: nav_msgs/msg/OccupancyGrid
  - name: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - name: ~/input/scenario
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/Scenario
  - name: ~/output/trajectory
    type: publisher
    msg_type: autoware_planning_msgs/msg/Trajectory
  - name: ~/debug/pose_array
    type: publisher
    msg_type: geometry_msgs/msg/PoseArray
  - name: ~/debug/partial_pose_array
    type: publisher
    msg_type: geometry_msgs/msg/PoseArray
  - name: is_completed
    type: publisher
    msg_type: std_msgs/msg/Bool
  - name: ~/debug/processing_time_ms
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float64Stamped
