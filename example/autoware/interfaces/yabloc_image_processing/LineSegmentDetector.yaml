connections:
  - topic: ~/input/image_raw
    type: subscription
    msg_type: sensor_msgs/msg/Image
  - topic: ~/output/line_segments_cloud
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
  - topic: ~/debug/image_with_line_segments
    type: publisher
    msg_type: sensor_msgs/msg/Image
