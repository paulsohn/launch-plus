    type: subscription
    msg_type: autoware_adapi_v1_msgs/msg/OperationModeState
  - name: /vehicle/doors/status
    type: subscription
    msg_type: autoware_adapi_v1_msgs/msg/DoorStatusArray
  - name: /api/vehicle/doors/status
    type: publisher
    msg_type: autoware_adapi_v1_msgs/msg/DoorStatusArray
  - name: /api/vehicle/doors/command
    type: service_server
    msg_type: autoware_adapi_v1_msgs/srv/SetDoorCommand
  - name: /api/vehicle/doors/layout
    type: service_server
    msg_type: autoware_adapi_v1_msgs/srv/GetDoorLayout
  - name: /vehicle/doors/command
    type: service_client
    msg_type: autoware_adapi_v1_msgs/srv/SetDoorCommand
  - name: /vehicle/doors/layout
    type: service_client
    msg_type: autoware_adapi_v1_msgs/srv/GetDoorLayout
  - name: /diagnostics
    type: publisher
    msg_type: diagnostic_msgs/msg/DiagnosticArray
