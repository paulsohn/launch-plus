connections:
  - topic: imu/data_tf_converted
    type: subscription
    msg_type: sensor_msgs/msg/Imu
  - topic: yaw_rate_offset_2nd
    type: subscription
    msg_type: eagleye_msgs/msg/YawrateOffset
  - topic: angular_velocity_offset_stop
    type: subscription
    msg_type: eagleye_msgs/msg/AngularVelocityOffset
  - topic: acc_x_offset
    type: subscription
    msg_type: eagleye_msgs/msg/AccXOffset
  - topic: acc_x_scale_factor
    type: subscription
    msg_type: eagleye_msgs/msg/AccXScaleFactor
  - topic: imu/data_corrected
    type: publisher
    msg_type: sensor_msgs/msg/Imu
