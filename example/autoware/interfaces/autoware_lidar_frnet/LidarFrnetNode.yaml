connections:
  - name: ~/input/pointcloud
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2
  - name: ~/output/pointcloud/segmentation
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
  - name: ~/output/pointcloud/visualization
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
  - name: ~/output/pointcloud/filtered
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
  - name: ~/debug/ego_crop_box_marker
    type: publisher
    msg_type: visualization_msgs/msg/Marker
