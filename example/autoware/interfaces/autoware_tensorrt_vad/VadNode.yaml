connections:
  - loop: "range(params.get('node_params.num_cameras', 6))"
    name_expr: "'~/input/image%d' % item"
    type: subscription
    msg_type: sensor_msgs/msg/Image
  - loop: "range(params.get('node_params.num_cameras', 6))"
    name_expr: "'~/input/camera_info%d' % item"
    type: subscription
    msg_type: sensor_msgs/msg/CameraInfo
  - name: ~/input/kinematic_state
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - name: ~/input/acceleration
    type: subscription
    msg_type: geometry_msgs/msg/AccelWithCovarianceStamped
  - name: /tf_static
    type: subscription
    msg_type: tf2_msgs/msg/TFMessage
  - name: ~/output/trajectory
    type: publisher
    msg_type: autoware_planning_msgs/msg/Trajectory
  - name: ~/output/trajectories
    type: publisher
    msg_type: autoware_internal_planning_msgs/msg/CandidateTrajectories
  - name: ~/output/objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/PredictedObjects
  - name: ~/output/map
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
