connections:
  # Inputs (InterProcessPollingSubscriber)
  - topic: ~/input/pointcloud
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2

  - topic: ~/input/velocity
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/VelocityReport

  - topic: ~/input/imu
    type: subscription
    msg_type: sensor_msgs/msg/Imu

  - topic: ~/input/predicted_trajectory
    type: subscription
    msg_type: autoware_planning_msgs/msg/Trajectory

  - topic: ~/input/objects
    type: subscription
    msg_type: autoware_perception_msgs/msg/PredictedObjects

  - topic: /autoware/state
    type: subscription
    msg_type: autoware_system_msgs/msg/AutowareState

  # Outputs
  - topic: ~/metrics
    type: publisher
    msg_type: tier4_metric_msgs/msg/MetricArray

  - topic: ~/virtual_wall
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray

  - topic: ~/debug/obstacle_pointcloud
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
    when: "params.get('publish_debug_pointcloud', False)"

  - topic: ~/debug/markers
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
    when: "params.get('publish_debug_markers', False)"

  - topic: ~/debug/rss_distance
    type: publisher
    msg_type: tier4_debug_msgs/msg/Float32Stamped

  - topic: ~/debug/processing_time_detail_ms
    type: publisher
    msg_type: autoware_utils/ProcessingTimeDetail
