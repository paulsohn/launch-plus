connections:
  - topic: /vehicle/status/steering_status
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/SteeringReport
  - topic: /vehicle/status/velocity_status
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/VelocityReport
  - topic: /planning/route_state
    type: subscription
    msg_type: autoware_planning_msgs/msg/RouteState
  - topic: ~/control
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/Control
  - topic: ~/gear
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/GearCommand
  - topic: ~/turn_indicators
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/TurnIndicatorsCommand
  - topic: ~/hazard_lights
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/HazardLightsCommand
