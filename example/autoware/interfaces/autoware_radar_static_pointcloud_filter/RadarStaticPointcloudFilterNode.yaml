connections:
  - topic: ~/input/radar
    type: subscription
    msg_type: radar_msgs/msg/RadarScan
  - topic: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - topic: ~/output/static_radar_scan
    type: publisher
    msg_type: radar_msgs/msg/RadarScan
  - topic: ~/output/dynamic_radar_scan
    type: publisher
    msg_type: radar_msgs/msg/RadarScan
