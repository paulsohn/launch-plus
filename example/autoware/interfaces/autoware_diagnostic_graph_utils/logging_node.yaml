# Subscribes to the diagnostic graph via DiagGraphSubscription (absolute topics).
# Publishes a periodic text dump of the error graph subtree rooted at 'root_path'.
connections:
  - name: /diagnostics_graph/struct
    type: subscription
    msg_type: tier4_system_msgs/msg/DiagGraphStruct
  - name: /diagnostics_graph/status
    type: subscription
    msg_type: tier4_system_msgs/msg/DiagGraphStatus
  - name: ~/debug/error_graph_text
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/StringStamped
