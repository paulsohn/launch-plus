  - topic: /planning/cooperate_status/start_planner
    type: publisher
    msg_type: tier4_rtc_msgs/msg/CooperateStatusArray
    when: "'autoware::behavior_path_planner::StartPlannerModuleManager' in params.get('launch_modules', [])"

  - topic: /planning/cooperate_commands/start_planner
