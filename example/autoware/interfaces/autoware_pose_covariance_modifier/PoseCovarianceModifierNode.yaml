connections:
  - topic: input_gnss_pose_with_cov_topic
    type: subscription
    msg_type: geometry_msgs/msg/PoseWithCovarianceStamped
  - topic: input_ndt_pose_with_cov_topic
    type: subscription
    msg_type: geometry_msgs/msg/PoseWithCovarianceStamped
  - topic: output_pose_with_covariance_topic
    type: publisher
    msg_type: geometry_msgs/msg/PoseWithCovarianceStamped
  - topic: ~/selected_pose_type
    type: publisher
    msg_type: std_msgs/msg/String
  - topic: ~/debug/ndt_position_stddev
    type: publisher
    msg_type: std_msgs/msg/Float64
    when: "params.get('enable_debug_topics', False)"
  - topic: ~/debug/gnss_position_stddev
    type: publisher
    msg_type: std_msgs/msg/Float64
    when: "params.get('enable_debug_topics', False)"
