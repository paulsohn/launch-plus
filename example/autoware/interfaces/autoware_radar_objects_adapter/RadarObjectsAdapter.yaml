connections:
  - name: ~/input/objects
    type: subscription
    msg_type: autoware_sensing_msgs/msg/RadarObjects
  - name: ~/input/radar_info
    type: subscription
    msg_type: autoware_sensing_msgs/msg/RadarInfo
  - name: ~/output/detections
    type: publisher
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - name: ~/output/tracks
    type: publisher
    msg_type: autoware_perception_msgs/msg/TrackedObjects
