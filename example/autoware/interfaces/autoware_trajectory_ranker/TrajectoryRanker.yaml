connections:
  - topic: ~/input/candidate_trajectories
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/CandidateTrajectories
  - topic: ~/input/objects
    type: subscription
    msg_type: autoware_perception_msgs/msg/PredictedObjects
  - topic: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - topic: ~/input/vector_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin
  - topic: ~/input/route
    type: subscription
    msg_type: autoware_planning_msgs/msg/LaneletRoute
  - topic: ~/output/scored_trajectories
    type: publisher
    msg_type: autoware_internal_planning_msgs/msg/ScoredCandidateTrajectories
  - topic: ~/debug/processing_time_detail_ms/trajectory_ranker
    type: publisher
    msg_type: autoware_utils_debug/msg/ProcessingTimeDetail
