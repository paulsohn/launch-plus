connections:
  - name: ~/input/linear_velocity
    type: subscription
    msg_type: geometry_msgs/msg/TwistStamped
  - name: ~/input/angular_velocity
    type: subscription
    msg_type: geometry_msgs/msg/TwistStamped
  - name: ~/input/objects
    type: subscription
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - name: ~/input/validate_calibration_srv
    type: service
    msg_type: std_srvs/srv/Trigger
