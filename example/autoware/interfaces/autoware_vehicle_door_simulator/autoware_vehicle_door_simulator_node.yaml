connections:
  - topic: ~/doors/command
    type: service_server
    msg_type: autoware_adapi_v1_msgs/srv/SetDoorCommand
  - topic: ~/doors/layout
    type: service_server
    msg_type: autoware_adapi_v1_msgs/srv/GetDoorLayout
  - topic: ~/doors/status
    type: publisher
    msg_type: autoware_adapi_v1_msgs/msg/DoorStatusArray
