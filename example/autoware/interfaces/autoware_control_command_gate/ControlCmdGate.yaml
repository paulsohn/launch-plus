# Per-source input subscriptions: ~/inputs/<name>/control, ~/inputs/<name>/gear,
# ~/inputs/<name>/turn_indicators, ~/inputs/<name>/hazard_lights are created per
# source. The `inputs` param is a list[int] of source IDs; the name for each ID
# comes from `inputs_names.<id>` (a separate param per integer ID).
# (subscription.cpp:28: const auto prefix = "~/inputs/" + name + "/";)
# '$INVALID$' sentinel is used as default — contains '$' which is forbidden in ROS 2
# parameter key names, so it can never be a real source name.
connections:
  - name: /localization/kinematic_state
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - name: /localization/acceleration
    type: subscription
    msg_type: geometry_msgs/msg/AccelWithCovarianceStamped
  - name: /vehicle/status/steering_status
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/SteeringReport
  - name: /vehicle/status/control_mode
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/ControlModeReport
  - name: ~/output/control
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/Control
  - name: ~/output/gear
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/GearCommand
  - name: ~/output/turn_indicators
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/TurnIndicatorsCommand
  - name: ~/output/hazard_lights
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/HazardLightsCommand
  - name: ~/source/status
    type: publisher
    msg_type: autoware_control_command_gate/msg/CommandSourceStatus
  - name: ~/filter/status
    type: publisher
    msg_type: autoware_control_command_gate/msg/CommandFilterStatus
  - name: ~/source/change
    type: service_server
    msg_type: autoware_control_command_gate/srv/ChangeCommandSource
  - name: ~/filter/change
    type: service_server
    msg_type: autoware_control_command_gate/srv/ChangeCommandFilter
  - name: ~/source/select
    type: service_server
    msg_type: autoware_control_command_gate/srv/SelectCommandSource

  # ── Per-source input subscriptions ──────────────────────────────────────────────────────────────
  - loop: "[params.get('inputs_names.' + str(i), '$INVALID$') for i in to_list(params.get('inputs', []))]"
    name_expr: "'~/inputs/' + item + '/control'"
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/Control

  - loop: "[params.get('inputs_names.' + str(i), '$INVALID$') for i in to_list(params.get('inputs', []))]"
    name_expr: "'~/inputs/' + item + '/gear'"
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/GearCommand

  - loop: "[params.get('inputs_names.' + str(i), '$INVALID$') for i in to_list(params.get('inputs', []))]"
    name_expr: "'~/inputs/' + item + '/turn_indicators'"
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/TurnIndicatorsCommand

  - loop: "[params.get('inputs_names.' + str(i), '$INVALID$') for i in to_list(params.get('inputs', []))]"
    name_expr: "'~/inputs/' + item + '/hazard_lights'"
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/HazardLightsCommand
