connections:
  - topic: ~/input/trajectory
    type: subscription
    msg_type: autoware_planning_msgs/msg/Trajectory
  - topic: ~/input/reference_trajectory
    type: subscription
    msg_type: autoware_planning_msgs/msg/Trajectory
  - topic: ~/input/objects
    type: subscription
    msg_type: autoware_perception_msgs/msg/PredictedObjects
  - topic: ~/input/modified_goal
    type: subscription
    msg_type: autoware_planning_msgs/msg/PoseWithUuidStamped
  - topic: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - topic: ~/input/route
    type: subscription
    msg_type: autoware_planning_msgs/msg/LaneletRoute
  - topic: ~/input/vector_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin
  - topic: ~/input/acceleration
    type: subscription
    msg_type: geometry_msgs/msg/AccelWithCovarianceStamped
  - topic: ~/input/steering_status
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/SteeringReport
  - topic: ~/input/turn_indicators_status
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/TurnIndicatorsReport
  # Dynamic subscriptions: one per module in stop_decision.module_list param,
  # topic = stop_decision.topic_prefix + module_name. Not statically expressible.
  # See todo.md for details.
  - topic: ~/metrics
    type: publisher
    msg_type: tier4_metric_msgs/msg/MetricArray
  - topic: ~/debug/processing_time_ms
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float64Stamped
