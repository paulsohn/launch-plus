connections:
  # Pointcloud subscription via CudaBlackboardSubscriber (not create_subscription)
  - name: ~/input/pointcloud
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2
  - loop: "range(params.get('num_cameras', 6))"
    name_expr: "'~/input/image%d' % item"
    type: subscription
    msg_type: sensor_msgs/msg/Image
  - loop: "range(params.get('num_cameras', 6))"
    name_expr: "'~/input/camera_info%d' % item"
    type: subscription
    msg_type: sensor_msgs/msg/CameraInfo
  - name: ~/output/objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/DetectedObjects
