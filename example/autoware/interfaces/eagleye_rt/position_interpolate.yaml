connections:
  - name: enu_vel
    type: subscription
    msg_type: geometry_msgs/msg/Vector3Stamped
  - name: enu_absolute_pos
    type: subscription
    msg_type: eagleye_msgs/msg/Position
  - name: gnss_smooth_pos_enu
    type: subscription
    msg_type: eagleye_msgs/msg/Position
  - name: height
    type: subscription
    msg_type: eagleye_msgs/msg/Height
  - name: enu_absolute_pos_interpolate
    type: publisher
    msg_type: eagleye_msgs/msg/Position
  - name: fix
    type: publisher
    msg_type: sensor_msgs/msg/NavSatFix
