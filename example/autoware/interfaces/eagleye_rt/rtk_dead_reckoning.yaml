connections:
  - name: enu_vel
    type: subscription
    msg_type: geometry_msgs/msg/Vector3Stamped
  - name: heading_interpolate_3rd
    type: subscription
    msg_type: eagleye_msgs/msg/Heading
  - name: enu_absolute_pos_interpolate
    type: publisher
    msg_type: eagleye_msgs/msg/Position
  - name: fix
    type: publisher
    msg_type: sensor_msgs/msg/NavSatFix
