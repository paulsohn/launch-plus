name: Autoware Reindex

on:
  schedule:
    - cron: "0 21 * * 0" # Monday 6 AM KST (Sunday 9 PM UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  reindex:
    name: Update lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: devel

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build launch-plus
        run: cargo build --bin launch-plus --release

      - name: Reindex Autoware manifest
        working-directory: example/autoware
        run: ../../target/release/launch-plus index

      - name: Create PR if lockfile changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/reindex-lockfile
          base: devel
          title: "chore: update Autoware lockfile"
          body: |
            Automated lockfile update from `launch-plus index`.

            This PR re-resolves repository refs in `example/autoware/manifest.lock.repos`
            to their latest commit SHAs.
          commit-message: "chore: update Autoware lockfile"
          add-paths: example/autoware/manifest.lock.repos
