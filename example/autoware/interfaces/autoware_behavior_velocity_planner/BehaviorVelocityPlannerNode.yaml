  # ---- RTC topics (absolute paths) from SceneModuleManagerInterfaceWithRTC ----
  # RTCInterface creates absolute topics for cooperative status, auto-mode status,
  # cooperate commands service, and enable_auto_mode service.
  # Applies to: crosswalk, traffic_light, intersection, blind_spot, detection_area, no_stopping_area.
  # intersection also creates a second RTCInterface named "intersection_occlusion".
  # ObjectsOfInterestMarkerInterface adds /planning/debug/objects_of_interest/<module_name>.

  - name: /planning/cooperate_status/crosswalk
    type: publisher
    msg_type: tier4_rtc_msgs/msg/CooperateStatusArray
    when: "'autoware::behavior_velocity_planner::experimental::CrosswalkModulePlugin' in params.get('launch_modules', [])"

  - name: /planning/auto_mode_status/crosswalk
