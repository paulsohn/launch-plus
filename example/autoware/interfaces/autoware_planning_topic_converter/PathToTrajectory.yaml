# Topics resolved from runtime parameters: input_topic, output_topic
# Static types known from template: Path -> Trajectory
connections:
  - topic: "params['input_topic']"
    type: subscription
    msg_type: autoware_planning_msgs/msg/Path
  - topic: "params['output_topic']"
    type: publisher
    msg_type: autoware_planning_msgs/msg/Trajectory
