connections:
  - name: ~/input/vector_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin
  - name: ~/input/pose
    type: subscription
    msg_type: geometry_msgs/msg/PoseStamped
  - name: ~/output/height
    type: publisher
    msg_type: std_msgs/msg/Float32
  - name: ~/output/ground
    type: publisher
    msg_type: std_msgs/msg/Float32MultiArray
  - name: ~/debug/ground_markers
    type: publisher
    msg_type: visualization_msgs/msg/Marker
  - name: ~/debug/ground_status
    type: publisher
    msg_type: std_msgs/msg/String
  - name: ~/debug/near_cloud
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
