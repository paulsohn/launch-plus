connections:
  - name: ~/input/pose_with_covariance
    type: subscription
    msg_type: geometry_msgs/msg/PoseWithCovarianceStamped
  - name: ~/input/twist_with_covariance
    type: subscription
    msg_type: geometry_msgs/msg/TwistWithCovarianceStamped
  - name: ~/output/odometry
    type: publisher
    msg_type: nav_msgs/msg/Odometry
