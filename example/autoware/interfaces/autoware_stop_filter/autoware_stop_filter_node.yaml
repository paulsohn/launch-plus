connections:
  # Subscription
  - name: input/odom
    type: subscription
    msg_type: nav_msgs/msg/Odometry

  # Publishers
  - name: output/odom
    type: publisher
    msg_type: nav_msgs/msg/Odometry

  - name: debug/stop_flag
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/BoolStamped
