[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roscope"
version = "0.2.0"
description = "ROS 2 launch resolver and build orchestrator"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "paulsohn" }
]
keywords = ["ros2", "launch", "build-system", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.0",
    "lark>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.scripts]
roscope = "roscope.cli:main"

[project.entry-points."ros2cli.command"]
roscope = "roscope.verb:RoscopeCommand"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["roscope"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["example/autoware/src", "example/autoware/core", "example/autoware/launcher", "example/autoware/universe"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "N806",   # uppercase variable names in functions (_SENTINEL, _TRANSITION_MAP) — module-level constants in nested scope
    "N812",   # import R alias in tests — idiomatic shorthand
    "SIM105", # contextlib.suppress — many try/except/pass blocks have side effects before pass
]

[tool.ruff.lint.per-file-ignores]
"roscope/resolver.py" = ["E501", "E402"]  # long lines and import ordering — acceptable in this module

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
# Gradual adoption: typed functions are checked, untyped functions are allowed.
# New code should have type hints; existing code is migrated incrementally.
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
