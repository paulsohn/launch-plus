connections:
  - topic: input
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2
  - topic: input/rois0
    type: subscription
    msg_type: sensor_msgs/msg/Image
  - topic: input/camera_info0
    type: subscription
    msg_type: sensor_msgs/msg/CameraInfo
  - topic: output
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
  - topic: ~/debug/mask
    type: publisher
    msg_type: sensor_msgs/msg/Image
