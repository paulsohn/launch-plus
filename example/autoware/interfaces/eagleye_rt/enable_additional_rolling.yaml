connections:
  - name: velocity_scale_factor
    type: subscription
    msg_type: eagleye_msgs/msg/VelocityScaleFactor
  - name: yaw_rate_offset_2nd
    type: subscription
    msg_type: eagleye_msgs/msg/YawrateOffset
  - name: yaw_rate_offset_stop
    type: subscription
    msg_type: eagleye_msgs/msg/YawrateOffset
  - name: distance
    type: subscription
    msg_type: eagleye_msgs/msg/Distance
  - name: angular_velocity_offset_stop
    type: subscription
    msg_type: eagleye_msgs/msg/AngularVelocityOffset
  - name: imu/data_tf_converted
    type: subscription
    msg_type: sensor_msgs/msg/Imu
  - name: acc_y_offset_additional_rolling
    type: publisher
    msg_type: eagleye_msgs/msg/AccYOffset
  - name: enable_additional_rolling
    type: publisher
    msg_type: eagleye_msgs/msg/Rolling
