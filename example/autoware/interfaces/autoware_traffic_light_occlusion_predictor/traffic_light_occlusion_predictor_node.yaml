connections:
  - name: ~/input/vector_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin
  - name: ~/input/car/traffic_signals
    type: subscription
    msg_type: tier4_perception_msgs/msg/TrafficLightArray
  - name: ~/input/pedestrian/traffic_signals
    type: subscription
    msg_type: tier4_perception_msgs/msg/TrafficLightArray
  - name: ~/input/rois
    type: subscription
    msg_type: tier4_perception_msgs/msg/TrafficLightRoiArray
  - name: ~/input/camera_info
    type: subscription
    msg_type: sensor_msgs/msg/CameraInfo
  - name: ~/input/cloud
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2
  - name: ~/output/traffic_signals
    type: publisher
    msg_type: tier4_perception_msgs/msg/TrafficLightArray
