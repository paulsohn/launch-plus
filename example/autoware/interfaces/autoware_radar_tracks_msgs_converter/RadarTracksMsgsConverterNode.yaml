connections:
  - topic: ~/input/radar_objects
    type: subscription
    msg_type: radar_msgs/msg/RadarTracks
  - topic: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - topic: ~/output/radar_tracked_objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/TrackedObjects
  - topic: ~/output/radar_detected_objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/DetectedObjects
