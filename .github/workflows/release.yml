name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: launch-plus-linux-amd64-ubuntu22.04
            cross: false

          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: launch-plus-linux-amd64-ubuntu24.04
            cross: false

          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: launch-plus-linux-arm64-ubuntu22.04
            cross: true

          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact: launch-plus-linux-arm64-ubuntu24.04
            cross: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.artifact }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --bin launch-plus --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --bin launch-plus --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cp target/${{ matrix.target }}/release/launch-plus ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
