connections:
  - topic: enu_vel
    type: subscription
    msg_type: geometry_msgs/msg/Vector3Stamped
  - topic: heading_interpolate_3rd
    type: subscription
    msg_type: eagleye_msgs/msg/Heading
  - topic: enu_absolute_pos_interpolate
    type: publisher
    msg_type: eagleye_msgs/msg/Position
  - topic: fix
    type: publisher
    msg_type: sensor_msgs/msg/NavSatFix
