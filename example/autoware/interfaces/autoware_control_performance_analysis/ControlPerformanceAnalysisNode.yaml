connections:
  - name: ~/input/reference_trajectory
    type: subscription
    msg_type: autoware_planning_msgs/msg/Trajectory
  - name: ~/input/control_raw
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/Control
  - name: ~/input/measured_steering
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/SteeringReport
  - name: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - name: ~/output/error_stamped
    type: publisher
    msg_type: autoware_control_msgs/msg/ErrorStamped
  - name: ~/output/driving_status_stamped
    type: publisher
    msg_type: autoware_control_msgs/msg/DrivingMonitorStamped
