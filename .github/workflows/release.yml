name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version-check:
    name: Verify tag matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare tag version with pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version:          $TAG_VERSION"
          echo "pyproject.toml version: $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version mismatch: tag is v${TAG_VERSION} but pyproject.toml has ${PYPROJECT_VERSION}"
            exit 1
          fi

  build-wheel:
    name: Build wheel
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm install -g pnpm@10
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  build-deb:
    name: Build deb (${{ matrix.os }})
    needs: version-check
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
        working-directory: roscope_viz
      - run: pnpm run build
        working-directory: roscope_viz
      - run: sudo apt-get update && sudo apt-get install -y python3-all debhelper dh-python pybuild-plugin-pyproject python3-hatchling
      - run: dpkg-buildpackage -us -uc -b -d
      - run: mv ../*.deb .
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.os }}
          path: "*.deb"

  release:
    name: Create Release
    needs: [build-wheel, build-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
