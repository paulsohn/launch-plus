connections:
  - topic: ~/diagnostics
    type: subscription
    msg_type: diagnostic_msgs/msg/DiagnosticArray
  - topic: ~/struct
    type: publisher
    msg_type: tier4_system_msgs/msg/DiagGraphStruct
  - topic: ~/status
    type: publisher
    msg_type: tier4_system_msgs/msg/DiagGraphStatus
  - topic: ~/unknowns
    type: publisher
    msg_type: diagnostic_msgs/msg/DiagnosticArray
  - topic: ~/reset
    type: service_server
    msg_type: tier4_system_msgs/srv/ResetDiagGraph
  - topic: ~/set_initializing
    type: service_server
    msg_type: std_srvs/srv/SetBool
  - topic: ~/set_override
    type: service_server
    msg_type: tier4_system_msgs/srv/SetDiagGraphOverride
  # Published when use_command_mode_mappings=true
  - topic: ~/availability
    type: publisher
    msg_type: tier4_system_msgs/msg/CommandModeAvailability
    when: "params.get('use_command_mode_mappings', False)"
  # Published when use_driving_mode_mappings=true
  - topic: /system/driving_mode/available
    type: publisher
    msg_type: tier4_system_msgs/msg/DrivingModeFlag
    when: "params.get('use_driving_mode_mappings', False)"
  - topic: /system/driving_mode/continuable
    type: publisher
    msg_type: tier4_system_msgs/msg/DrivingModeFlag
    when: "params.get('use_driving_mode_mappings', False)"
