connections:
  # Inputs (InterProcessPollingSubscriber)
  - topic: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry

  - topic: ~/input/acceleration
    type: subscription
    msg_type: geometry_msgs/msg/AccelWithCovarianceStamped

  - topic: ~/input/trajectory
    type: subscription
    msg_type: autoware_planning_msgs/msg/Trajectory

  - topic: ~/input/route
    type: subscription
    msg_type: autoware_planning_msgs/msg/LaneletRoute

  - topic: ~/input/vector_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin

  - topic: ~/input/behavior_path
    type: subscription
    msg_type: autoware_internal_planning_msgs/msg/PathWithLaneId

  - topic: ~/input/steering_status
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/SteeringReport

  - topic: ~/input/objects
    type: subscription
    msg_type: autoware_perception_msgs/msg/PredictedObjects

  # Dynamic planning_factor subscriptions — topic names are
  #   params["planning_factor_metrics.topic_prefix"] + module_name
  # Default prefix: /planning/planning_factors/
  # Default modules: blind_spot, crosswalk, detection_area, intersection,
  #   merge_from_private, no_drivable_lane, no_stopping_area, stop_line,
  #   traffic_light, virtual_traffic_light, walkway
  # EXCEPTION: runtime-configured list; static entries omitted.
  # See todo.md for tracking.

  # Outputs
  - topic: ~/metrics
    type: publisher
    msg_type: tier4_metric_msgs/msg/MetricArray

  - topic: ~/debug/processing_time_ms
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float64Stamped
