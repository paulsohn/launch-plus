connections:
  - name: input
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2
  - name: input/rois0
    type: subscription
    msg_type: tier4_perception_msgs/msg/DetectedObjectsWithFeature
  - name: input/camera_info0
    type: subscription
    msg_type: sensor_msgs/msg/CameraInfo
  - name: ~/output/objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - name: ~/debug/painted_pointcloud
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
