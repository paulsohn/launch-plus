connections:
  - name: input/odom
    type: subscription
    msg_type: nav_msgs/msg/Odometry
    when: "params.get('use_odom', False)"
  - name: input/twist
    type: subscription
    msg_type: geometry_msgs/msg/TwistWithCovarianceStamped
    when: "not params.get('use_odom', False)"
  - name: output/accel
    type: publisher
    msg_type: geometry_msgs/msg/AccelWithCovarianceStamped
