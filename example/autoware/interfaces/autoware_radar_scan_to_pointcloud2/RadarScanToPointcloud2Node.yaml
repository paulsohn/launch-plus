connections:
  - name: ~/input/radar
    type: subscription
    msg_type: radar_msgs/msg/RadarScan
  - name: ~/output/amplitude_pointcloud
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
  - name: ~/output/doppler_pointcloud
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
