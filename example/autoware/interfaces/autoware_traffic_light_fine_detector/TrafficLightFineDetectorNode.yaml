connections:
  - name: ~/input/image
    type: subscription
    msg_type: sensor_msgs/msg/Image
  - name: ~/input/rois
    type: subscription
    msg_type: tier4_perception_msgs/msg/TrafficLightRoiArray
  - name: ~/expect/rois
    type: subscription
    msg_type: tier4_perception_msgs/msg/TrafficLightRoiArray
  - name: ~/output/rois
    type: publisher
    msg_type: tier4_perception_msgs/msg/TrafficLightRoiArray
  - name: ~/debug/exe_time_ms
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float32Stamped
