connections:
  # Base Filter class topics
  - topic: input
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2
  - topic: output
    type: publisher
    msg_type: sensor_msgs/msg/PointCloud2
  # Static map loading (use_dynamic_map_loading == false)
  - topic: map
    type: subscription
    msg_type: sensor_msgs/msg/PointCloud2
    when: "not params.get('use_dynamic_map_loading', False)"
  # Dynamic map loading (use_dynamic_map_loading == true)
  - topic: kinematic_state
    type: subscription
    msg_type: nav_msgs/msg/Odometry
    when: "params.get('use_dynamic_map_loading', False)"
  - topic: map_loader_service
    type: service_client
    # msg_type: autoware_map_msgs/srv/GetDifferentialPointCloudMap
    when: "params.get('use_dynamic_map_loading', False)"
