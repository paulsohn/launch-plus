connections:
  - name: ~/input/objects
    type: subscription
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - name: ~/input/radars
    type: subscription
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - name: ~/output/objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/DetectedObjects
  - name: ~/debug/low_confidence_objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/DetectedObjects
