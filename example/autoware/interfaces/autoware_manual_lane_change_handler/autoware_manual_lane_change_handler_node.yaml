connections:
  - name: ~/input/vector_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin
  - name: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - name: /planning/mission_planning/route
    type: subscription
    msg_type: autoware_planning_msgs/msg/LaneletRoute
  - name: ~/input/reroute_availability
    type: subscription
    msg_type: tier4_planning_msgs/msg/RerouteAvailability
  - name: ~/set_preferred_lane
    type: service_server
    msg_type: tier4_external_api_msgs/srv/SetPreferredLane
  - name: /planning/mission_planning/mission_planner/set_preferred_primitive
    type: service_client
    msg_type: autoware_planning_msgs/srv/SetPreferredPrimitive
  - name: ~/debug/processing_time_ms
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float64Stamped
  - name: ~/debug/shift_number
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Int32Stamped
