connections:
  # Subscription
  - topic: input/odom
    type: subscription
    msg_type: nav_msgs/msg/Odometry

  # Publishers
  - topic: output/odom
    type: publisher
    msg_type: nav_msgs/msg/Odometry

  - topic: debug/stop_flag
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/BoolStamped
