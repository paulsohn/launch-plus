connections:
  - topic: input/detected_rois
    type: subscription
    msg_type: tier4_perception_msgs/msg/DetectedObjectsWithFeature
  - topic: input/rough_rois
    type: subscription
    msg_type: tier4_perception_msgs/msg/TrafficLightRoiArray
  - topic: input/expect_rois
    type: subscription
    msg_type: tier4_perception_msgs/msg/TrafficLightRoiArray
  - topic: input/camera_info
    type: subscription
    msg_type: sensor_msgs/msg/CameraInfo
  - topic: output/traffic_rois
    type: publisher
    msg_type: tier4_perception_msgs/msg/TrafficLightRoiArray
