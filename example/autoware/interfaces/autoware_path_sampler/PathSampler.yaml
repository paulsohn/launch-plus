connections:
  - topic: ~/input/path
    type: subscription
    msg_type: autoware_planning_msgs/msg/Path
  - topic: ~/input/odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - topic: ~/input/objects
    type: subscription
    msg_type: autoware_perception_msgs/msg/PredictedObjects
  - topic: ~/output/path
    type: publisher
    msg_type: autoware_planning_msgs/msg/Trajectory
  - topic: ~/virtual_wall
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
  - topic: ~/debug/marker
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
  - topic: ~/debug/calculation_time
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/StringStamped
