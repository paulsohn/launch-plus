# Python node: autoware_carla_interface (carla_autoware:main)
# Sensor publishers are created dynamically from a SensorRegistry/config file;
# only the statically defined vehicle interface topics are listed here.
connections:
  - topic: /clock
    type: publisher
    msg_type: rosgraph_msgs/msg/Clock
  - topic: /vehicle/status/velocity_status
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/VelocityReport
  - topic: /vehicle/status/steering_status
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/SteeringReport
  - topic: /vehicle/status/control_mode
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/ControlModeReport
  - topic: /vehicle/status/gear_status
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/GearReport
  - topic: /vehicle/status/actuation_status
    type: publisher
    msg_type: tier4_vehicle_msgs/msg/ActuationStatusStamped
  - topic: /vehicle/status/turn_indicators_status
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/TurnIndicatorsReport
  - topic: /vehicle/status/hazard_lights_status
    type: publisher
    msg_type: autoware_vehicle_msgs/msg/HazardLightsReport
  - topic: /control/command/actuation_cmd
    type: subscription
    msg_type: tier4_vehicle_msgs/msg/ActuationCommandStamped
  - topic: /initialpose
    type: subscription
    msg_type: geometry_msgs/msg/PoseWithCovarianceStamped
  - topic: /control/command/turn_indicators_cmd
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/TurnIndicatorsCommand
  - topic: /control/command/hazard_lights_cmd
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/HazardLightsCommand
  # Dynamic: sensor publishers created from runtime sensor config (camera, lidar, etc.)
