# Dynamic topics: ~/input/image<i> and ~/input/camera_info<i> are created per camera
# where i in range(num_cameras); only static entries are listed here.
connections:
  - name: ~/input/kinematic_state
    type: subscription
    msg_type: nav_msgs/msg/Odometry
  - name: ~/input/acceleration
    type: subscription
    msg_type: geometry_msgs/msg/AccelWithCovarianceStamped
  - name: /tf_static
    type: subscription
    msg_type: tf2_msgs/msg/TFMessage
  - name: ~/output/trajectory
    type: publisher
    msg_type: autoware_planning_msgs/msg/Trajectory
  - name: ~/output/trajectories
    type: publisher
    msg_type: autoware_internal_planning_msgs/msg/CandidateTrajectories
  - name: ~/output/objects
    type: publisher
    msg_type: autoware_perception_msgs/msg/PredictedObjects
  - name: ~/output/map
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
