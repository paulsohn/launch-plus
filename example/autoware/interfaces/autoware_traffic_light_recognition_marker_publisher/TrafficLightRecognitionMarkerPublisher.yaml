connections:
  - topic: ~/input/lanelet2_map
    type: subscription
    msg_type: autoware_map_msgs/msg/LaneletMapBin
  - topic: ~/input/traffic_signals
    type: subscription
    msg_type: autoware_perception_msgs/msg/TrafficLightGroupArray
  - topic: ~/output/marker
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray
