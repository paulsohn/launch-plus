connections:
  # Inputs (InterProcessPollingSubscriber)
  - name: ~/input/reference_trajectory
    type: subscription
    msg_type: autoware_planning_msgs/msg/Trajectory

  - name: ~/input/current_odometry
    type: subscription
    msg_type: nav_msgs/msg/Odometry

  - name: ~/input/current_steering
    type: subscription
    msg_type: autoware_vehicle_msgs/msg/SteeringReport

  - name: ~/input/current_accel
    type: subscription
    msg_type: geometry_msgs/msg/AccelWithCovarianceStamped

  - name: ~/input/current_operation_mode
    type: subscription
    msg_type: autoware_adapi_v1_msgs/msg/OperationModeState

  # MPC lateral controller steering offset update (transient_local)
  - name: ~/input/steering_offset_update
    type: subscription
    msg_type: autoware_internal_debug_msgs/msg/Float32Stamped

  # Outputs
  - name: ~/output/control_cmd
    type: publisher
    msg_type: autoware_control_msgs/msg/Control

  - name: ~/output/debug_marker
    type: publisher
    msg_type: visualization_msgs/msg/MarkerArray

  - name: ~/lateral/debug/processing_time_ms
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float64Stamped

  - name: ~/longitudinal/debug/processing_time_ms
    type: publisher
    msg_type: autoware_internal_debug_msgs/msg/Float64Stamped

  # Optional: published only when enable_control_cmd_horizon_pub is true
  - name: ~/debug/control_cmd_horizon
    type: publisher
    msg_type: autoware_control_msgs/msg/ControlHorizon
    when: "params.get('enable_control_cmd_horizon_pub', False)"

  # Note: lateral_controller_mode (mpc | pure_pursuit) and
  # longitudinal_controller_mode (pid) select the algorithm but do NOT
  # add or remove topics — the pub/sub interface is identical across modes.
